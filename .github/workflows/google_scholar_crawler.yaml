name: Get Citation Data

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'google_scholar_crawler/requirements.txt'

    - name: Install Dependencies
      run: |
        cd ./google_scholar_crawler
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Crawler & Push Data
      run: |
        cd ./google_scholar_crawler
        python main.py
        if [ -d "./results" ] && [ -f "./results/gs_data.json" ]; then
          cd ./results
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b google-scholar-stats
          git add *.json
          git commit -m "Updated Citation Data [skip ci]" || echo "No changes to commit"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin google-scholar-stats --force
        fi
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'DYha9k0AAAAJ' }}