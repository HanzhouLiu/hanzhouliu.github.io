<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzhou's CV - Hanzhou Liu</title>
    <link rel="stylesheet" type="text/css" href="./index/main.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/last_name-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/last_name-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-inner">
            <ul class="nav-items">
                <li class="nav-brand"><a href="index.html">Homepage</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="cv.html" class="active">CV</a></li>
                <li class="theme-toggle">
                    <a onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="Toggle theme"></i></a>
                </li>
            </ul>
        </div>
    </nav>

    <div id="main">

        <div class="page-title">Curriculum Vitae</div>

        <div class="cv-content">
            <p>Please download my CV below.</p>

            <a href="files/HanzhouLiu_CV.pdf" class="cv-download-btn" target="_blank">
                <i class="fas fa-file-pdf"></i> Download CV (PDF)
            </a>

            <div class="cv-embed">
                <iframe src="files/HanzhouLiu_CV.pdf" width="100%" height="800px"
                        title="Hanzhou Liu CV"></iframe>
            </div>

            <p class="cv-fallback">
                If the PDF doesn't display, please
                <a href="files/HanzhouLiu_CV.pdf" target="_blank">click here to download</a>.
            </p>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 Hanzhou Liu
        </div>

    </div>

    <script>
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const icon = document.getElementById('theme-icon');
        if (document.body.classList.contains('dark-mode')) {
            icon.className = 'fa-solid fa-moon';
            localStorage.setItem('theme', 'dark');
        } else {
            icon.className = 'fa-solid fa-sun';
            localStorage.setItem('theme', 'light');
        }
    }
    (function() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            var icon = document.getElementById('theme-icon');
            if (icon) icon.className = 'fa-solid fa-moon';
        }
    })();
    </script>
</body>
</html>
